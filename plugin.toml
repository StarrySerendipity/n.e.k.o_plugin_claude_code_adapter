[plugin]
name = "Claude Code Adapter"
type = "plugin"
description = """让猫娘指挥 Claude Code 干活的适配器插件。

【快速上手：怎么和猫娘说】
- 短任务（<5分钟）：直接说「用 Claude Code 帮我把 xxx 项目的 xxx 功能实现一下」，猫娘会调用 claude_code_execute 同步执行并直接回复结果。
- 长任务：说「提交一个 Claude Code 后台任务去做 xxx」，猫娘会 submit 后自行预估耗时，用 claude_code_wait 智能等待，完成后主动汇报。
- 会话控制：每个 Claude Code 会话都有唯一 UUID（即工具返回的 session_id）。同一项目的多轮迭代默认自动续跑同一会话；想强制新开就说「开个新会话去做」；想接回某个历史会话，把插件面板或 claude_code_list_sessions(include_history=true) 里看到的会话 UUID 发给猫娘，说「继续这个会话：<UUID>」即可，插件会自动定位会话归属目录，无需指定路径。
- 供应商切换：说「切换 Claude 供应商到 xxx」即可在官方/中转/第三方端点间切换（cc-switch 风格，仅注入子进程环境变量，不改全局配置）。

【工具集】
- claude_code_execute：同步执行（上限 300s）
- claude_code_submit / claude_code_wait / claude_code_poll / claude_code_cancel：异步任务（submit 提交 → wait 智能等待，任务一完成立即返回；超时按 suggested_next_wait_sec 续等）
- claude_code_list_sessions / clear_session / check_health / get_config：会话与环境管理（list_sessions 支持 include_history=true 列出所有历史会话 UUID）
- claude_code_list_providers / switch_provider / remove_provider：多供应商切换

【前端面板】内置 cc-switch 风格的会话管理界面：左侧会话列表、右侧对话详情，可查看每个会话的 UUID、完整对话内容，支持一键复制 UUID 和删除会话。

【注意事项】需要本机已安装 Claude Code CLI（npm install -g @anthropic-ai/claude-code）。失败时插件会自动用 session_id 续跑而非重开会话，尽量保留上下文。"""
short_description = "让猫娘指挥 Claude Code 干活：同步/异步执行、智能等待、基于 Claude 原生 UUID 的会话维持/新开/历史回溯、cc-switch 风格多供应商切换与会话管理面板。"
keywords = [
    "claude",
    "claude-code",
    "cli",
    "agent",
    "coding",
    "developer",
    "llm_tool",
    "adapter",
    "catgirl",
    "猫娘",
    "cc-switch",
    "provider",
    "session-manager",
]
version = "0.4.0"
id = "claude_code_adapter"
entry = "plugin.plugins.claude_code_adapter._plugin_main:ClaudeCodeAdapterPlugin"

[plugin.author]
name = "N.E.K.O Community"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin_state]
backend = "file"
persist_mode = "auto"

# 启用 PluginStore（SQLite KV 存储），用于持久化会话记录
[plugin.store]
enabled = true

# ---------------------------------------------------------------------------
# Claude Code Adapter 配置
# ---------------------------------------------------------------------------
[claude_code]
# Claude CLI 可执行文件路径。留空则自动检测（PATH 上的 `claude`）。
command = ""
# 默认模型（留空使用 Claude CLI 默认值）。例如 "sonnet" / "opus" / "claude-sonnet-4-5-20250929"。
model = ""
# 推理努力级别："" | "low" | "medium" | "high"。
effort = ""
# 单次执行最大轮次（0 = 使用 CLI 默认值）。
max_turns_per_run = 0
# 跳过权限提示（与 Paperclip 行为一致；仅用于受信任的本地开发场景）。
dangerously_skip_permissions = true
# 单次执行超时（秒）。main_server 上限 300s，这里取上限。
timeout_sec = 300
# 默认工作目录（留空 = 当前插件进程 cwd）。猫娘调用时可覆盖。
cwd = ""
# 附加系统提示文件路径（留空则不附加）。
append_system_prompt_file = ""
# 技能目录（留空则不注入 --add-dir）。
skills_dir = ""
# 失败后自动重试新会话的次数。
max_retries = 1
