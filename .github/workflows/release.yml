name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Build plugin package
      run: |
        uv venv
        uv pip install pytest
        uv run python -m plugin.neko_plugin_cli.cli check -r --market-release claude_code_adapter
    
    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      with:
        files: dist/claude_code_adapter.neko-plugin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
